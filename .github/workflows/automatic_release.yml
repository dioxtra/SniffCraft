name: Automatic Release

on:
  # Can also be started from the Actions tab
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

# Forks get a read-only GITHUB_TOKEN by default, the release job needs to publish
permissions:
  contents: write

jobs:
  build_os_matrix:
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              name: Windows,
              os: windows-latest
            }
          - {
              name: Linux,
              os: ubuntu-latest
            }
          - {
              name: macOS,
              os: macos-latest
            }
    uses: ./.github/workflows/sniffcraft_build.yml
    with:
      os: ${{ matrix.config.os }}

  list_versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: List the versions for the Wireshark extcap
        id: list
        run: echo "versions=$(python3 tools/build_versions.py --list-json)" >> $GITHUB_OUTPUT

  # Headless builds for other game versions, selectable in the Wireshark extcap options
  build_versions:
    name: ${{ matrix.os }} ${{ matrix.version }}
    needs: list_versions
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        version: ${{ fromJSON(needs.list_versions.outputs.versions) }}
    uses: ./.github/workflows/sniffcraft_build.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      headless: true
      artifact_suffix: -${{ matrix.version }}


  release:
    runs-on: ubuntu-latest
    needs:
      - build_os_matrix
      - build_versions
    # A failed build for an old version shouldn't block the release, the bundles just won't have it
    if: ${{ !cancelled() && needs.build_os_matrix.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: sniffcraft-Linux
          path: linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: sniffcraft-Windows
          path: windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: sniffcraft-macOS
          path: macos

      - name: Download Windows builds for other versions
        uses: actions/download-artifact@v8
        with:
          pattern: sniffcraft-Windows-*
          path: windows-versions

      - name: Download Linux builds for other versions
        uses: actions/download-artifact@v8
        with:
          pattern: sniffcraft-Linux-*
          path: linux-versions

      - name: Download version artifact
        uses: actions/download-artifact@v8
        with:
          name: MC-version
          path: version

      - name: Retrieve MC game version
        id: mc-version
        run: echo "version=$(cat version/version.txt)" >> $GITHUB_OUTPUT

      - name: Create release note
        run: |
            echo Automatically generated binaries with GUI support for Minecraft ${{ steps.mc-version.outputs.version }}. > release_note.txt
            echo -en '\n' >> release_note.txt
            echo "Examples of conf files can be found [here](https://github.com/${{ github.repository }}/tree/master/conf)." >> release_note.txt
            echo -en '\n' >> release_note.txt
            echo "Wireshark: sniffcraft-wireshark-windows.zip and sniffcraft-wireshark-linux.zip contain SniffCraft for many Minecraft versions and the dissectors (sniffcraft-wireshark.zip only has the dissectors), see the [Wireshark section](https://github.com/${{ github.repository }}#wireshark) of the README." >> release_note.txt
            echo -en '\n' >> release_note.txt
            echo "💡 If you need binaries for a previous version of Minecraft, you can open [an issue using this link](https://github.com/${{ github.repository }}/issues/new?assignees=&labels=version+request&template=version-request.yml&title=%5BVersion+request%5D) and it will be automagically generated for you in a few minutes." >> release_note.txt
            echo -en '\n' >> release_note.txt
            echo **Changes:** >> release_note.txt

      - name: Append git commits
        run: git log latest..HEAD --oneline --no-merges >> release_note.txt || git log -20 --oneline --no-merges >> release_note.txt

      - name: Package Wireshark bundles
        run: |
          for os in windows linux; do
            suffix=$([ $os = windows ] && echo .exe || echo "")
            bundle=bundle-$os
            mkdir -p $bundle/sniffcraft_versions
            cp $os/sniffcraft$suffix $bundle/
            for dir in $os-versions/sniffcraft-*; do
              [ -d "$dir" ] || continue
              cp $dir/sniffcraft$suffix $bundle/sniffcraft_versions/sniffcraft-${dir##*-}$suffix
            done
            cp -r wireshark/sniffcraft.lua wireshark/minecraft.lua wireshark/minecraft_mcdata wireshark/install.ps1 $bundle/
            chmod +x $bundle/sniffcraft$suffix $bundle/sniffcraft_versions/*
            (cd $bundle && zip -r ../sniffcraft-wireshark-$os.zip .)
          done

      - name: Rename artifacts
        run: |
          mv linux/sniffcraft sniffcraft-linux-${{ steps.mc-version.outputs.version }}
          mv windows/sniffcraft.exe sniffcraft-windows-${{ steps.mc-version.outputs.version }}.exe
          mv macos/sniffcraft sniffcraft-macos-${{ steps.mc-version.outputs.version }}
      - name: Package Wireshark dissectors
        working-directory: wireshark
        run: zip -r ../sniffcraft-wireshark.zip sniffcraft.lua minecraft.lua minecraft_mcdata install.ps1

      - name: Remove old latest release
        run: gh release delete latest --repo ${{ github.repository }} --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create new latest release
        run: >
          gh release create latest
          sniffcraft-linux-${{ steps.mc-version.outputs.version }}
          sniffcraft-windows-${{ steps.mc-version.outputs.version }}.exe
          sniffcraft-macos-${{ steps.mc-version.outputs.version }}
          sniffcraft-wireshark.zip
          sniffcraft-wireshark-windows.zip
          sniffcraft-wireshark-linux.zip
          --repo ${{ github.repository }}
          --latest
          -F release_note.txt
          -t Latest
        env:
          GH_TOKEN: ${{ github.token }}
